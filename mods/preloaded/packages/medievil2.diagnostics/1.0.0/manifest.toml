format_version = 5
id = "medievil2.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "MediEvil II Recompiled"
license = "GPL-3.0-only"
description = "Records a replayable input and state trace with the starting memory cards, and shows the accepted inputs. Enabled by default for playtests."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94564"

[[feature]]
id = "recording"
name = "Input Recording"
description = "Writes inputs.csv, session settings and starting card copies beneath saves/diagnostics beside the game. Zip the newest session folder when reporting a bug. The disc and BIOS are never included."
group = "Diagnostics"
default_enabled = true

[[feature]]
id = "osd"
name = "Input Display"
description = "Shows the accepted P1/P2 buttons, a frame counter and REC/PLAY status in the corner. Turning this off does not stop recording."
group = "Diagnostics"
default_enabled = true

[[plugin]]
feature = "recording"
id = "medievil2.diagnostics"

[[plugin]]
feature = "osd"
id = "medievil2.diagnostics.osd"
