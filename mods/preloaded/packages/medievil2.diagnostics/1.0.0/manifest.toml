format_version = 5
id = "medievil2.diagnostics"
version = "1.0.0"
name = "Playtest Diagnostics"
author = "MediEvil II Recompiled"
license = "GPL-3.0-only"
description = "Records inputs, controller presence, timing and gameplay evidence with starting memory cards. Press L3 + R3 to mark a problem. Off by default; enable it before reproducing a problem you want to report."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94564"

[[feature]]
id = "recording"
name = "Input Recording"
description = "Writes inputs.csv, session settings and starting card copies beneath saves/diagnostics beside the game. Zip the newest session folder when reporting a bug. The disc and BIOS are never included."
group = "Diagnostics"
default_enabled = false

[[feature]]
id = "osd"
name = "Input Display"
description = "Shows the accepted P1/P2 buttons, a frame counter and REC/PLAY status in the corner. Turning this off does not stop recording."
group = "Diagnostics"
default_enabled = false

[[plugin]]
feature = "recording"
id = "medievil2.diagnostics"

[[plugin]]
feature = "osd"
id = "medievil2.diagnostics.osd"
