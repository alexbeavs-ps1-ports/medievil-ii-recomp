format_version = 7
id = "medievil2.enhancement.widescreen"
version = "1.0.0"
name = "MediEvil II Adaptive View"
author = "MediEvil II Recompiled"
license = "GPL-3.0-only"
description = "Render additional world geometry to fit the window."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94564"
disc_sha256 = "dfcb8602274c70f59551e820d0f4026b0213fd68b7d2a385189d37eb767b2d97"

[[feature]]
id = "widescreen"
name = "Adaptive View"
description = "Fit the world to your window and draw terrain farther away with stable surfaces. Movies and text keep their original proportions."
group = "Display"
default_enabled = true

[[plugin]]
feature = "widescreen"
id = "medievil2.widescreen"

[[requirement]]
feature = "widescreen"
package = "psx.enhancement.8mb-ram"
version = "1.0.0"
requires_feature = "8mb-ram"

# Read expanded twelve-byte capture records: 0x8007fa74.
[[patch]]
feature = "widescreen"
target = "disc_user"
offset = 108870260
expected = "94 00 25 24"
replace = "30 80 05 3c"

# Emit original polygons instead of area-selected subdivision: 0x8007fefc.
[[patch]]
feature = "widescreen"
target = "disc_user"
offset = 108871420
expected = "06 a8 3e 00"
replace = "21 a8 00 00"

# Fixed-size fog table depth step: 0x8007ff10.
