format_version = 7
id = "medievil2.input.modern-controls"
version = "1.0.0"
name = "MediEvil II Modern Controls"
author = "MediEvil II Recompiled"
license = "GPL-3.0-only"
description = "Right-stick camera by default; optional mouse camera, WASD movement and configurable mouse actions. Native layout A."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94564"

[[feature]]
id = "camera-controls"
name = "Right-stick Camera"
description = "Present a DualShock so the right stick controls the native camera, including when the launcher is set to digital. Camera follows stick direction by default. Native camera collision and room restrictions remain."
group = "Controls"
default_enabled = true

[[plugin]]
feature = "camera-controls"
id = "medievil2.camera-controls"
order = -10

[[feature]]
id = "modern-controls"
name = "Mouse and Keyboard"
description = "WASD move, Space jump, left/right click attack/charge, middle click inventory, side buttons switch weapon/target, Shift defend/dash, E switch weapons, F interact, Q change target, Ctrl strafe, Tab inventory, Enter pause. 1/2/3/4/5/6: attack/charge/defend/switch weapon/switch Dan-Hand/inventory. Click to capture the mouse, Escape to release. Capture stays through native menus/cutscenes/loading; hold Alt for first-person look. Native layout A."
group = "Controls"
default_enabled = false

[[plugin]]
feature = "modern-controls"
id = "medievil2.modern-controls"
order = 10

[[option]]
feature = "modern-controls"
id = "sensitivity"
label = "Mouse sensitivity"
type = "choice"
default = "normal"

[[option.choice]]
value = "low"
label = "Low"
[[option.choice]]
value = "normal"
label = "Normal"
[[option.choice]]
value = "high"
label = "High"

[[option]]
feature = "camera-controls"
id = "controller-reverse-x"
label = "Reverse controller horizontal look"
type = "boolean"
default = "false"

[[option]]
feature = "camera-controls"
id = "controller-reverse-y"
label = "Reverse controller vertical look"
type = "boolean"
default = "false"

[[option]]
feature = "modern-controls"
id = "mouse-reverse-x"
label = "Reverse mouse horizontal look"
type = "boolean"
default = "false"

[[option]]
feature = "modern-controls"
id = "mouse-reverse-y"
label = "Reverse mouse vertical look"
type = "boolean"
default = "false"

[[option]]
