resolution_reference_lines = 240
# Precision belongs to the default-on PGXP mod, so turning it off works.
geometry_correction = false
perspective_texturing = false
pgxp_cpu_mode = true
pgxp_tolerance = 1.0

[widescreen]
offer = false
adaptive_view = true
native_wide = true
gte_game_mode = true
precise_nclip = true
# World polygons must not be mistaken for screen-edge HUD packets.
nw_hud_corners = false
nw_backdrop = true

[widescreen.cull]
guard_pixels = 32
auto_screen_x = true
screen_w_imms = ["0x140", "0x141", "0x200"]
screen_h_imms = ["0xF0", "0xF1", "0x100"]
nclip_exact_sites = ["0x8007FCE0", "0x8007FCE8", "0x8007FD18"]

# Packed signs contain both X and Y. Retain the Y reject at wide ratios.
[[widescreen.cull.masked_reject]]
address = "0x8007FE30"
expected = "0x15800203"
reject_mask = "0xFFFF0000"

[controller]
default_mode = "digital"

# Online mount gate: digests + track count + optional TOC fingerprint
